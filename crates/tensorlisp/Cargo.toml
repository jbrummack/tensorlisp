[package]
name = "tensorlisp"
version.workspace = true
edition.workspace = true
description = "Runtime: loads a tensorlisp program + weights from GGUF and runs it on ggml."

[features]
# ggml's CUDA backend (Device::Gpu) plus the native CUDA executor.
cuda = ["ggml-sys/cuda", "native-cuda"]
# Only the native CUDA executor (Device::Native), no nvcc build of ggml-cuda.
native-cuda = ["dep:tensorlisp-kernels"]

[dependencies]
chez.workspace = true
ggml-sys.workspace = true
anyhow.workspace = true
thiserror.workspace = true
ndarray = "0.17.2"
autopro = { path = "../../../autopro" }
image = "0.25.10"
safetensors = "0.8.0"
serde_json = "1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
tensorlisp-kernels = { path = "../kernels" }

[target.'cfg(not(target_os = "macos"))'.dependencies]
tensorlisp-kernels = { path = "../kernels", features = ["cuda"], optional = true }
