[package]
name = "tensorlisp"
version.workspace = true
edition.workspace = true
description = "Runtime: loads a tensorlisp program + weights from GGUF and runs it on ggml."

[features]
# ggml's CUDA backend (Device::Gpu) plus the native CUDA executor.
cuda = ["ggml-sys/cuda", "native-cuda"]
# ggml's own Vulkan backend (--device gpu); see crates/ggml-sys.
vulkan = ["ggml-sys/vulkan"]
# Only the native CUDA executor (Device::Native), no nvcc build of ggml-cuda.
native-cuda = ["dep:tensorlisp-kernels", "tensorlisp-kernels/cuda"]
# Only the native Vulkan executor (Device::Native) over ggml's precompiled shaders; no ggml-vulkan.
# Needs scripts/build-ggml-vulkan-shaders.sh run once. Ignored when native-cuda is also on.
native-vulkan = ["dep:tensorlisp-kernels", "tensorlisp-kernels/vulkan"]
# The native CUDA device running the Vulkan executor's Tree lowering (every node on PTX kernels from the
# Tree compiler) instead of the hand-written NVRTC kernels. Takes the place of native-cuda's executor.
native-cuda-tree = ["native-cuda", "tensorlisp-kernels/vulkan"]

# The native Metal device running the Vulkan executor's Tree lowering (every node on MSL kernels from the
# Tree compiler) instead of the native Metal executor over ggml's .metal kernels. macOS only.
native-metal-tree = ["tensorlisp-kernels/metal-tree"]

[dependencies]
chez.workspace = true
ggml-sys.workspace = true
anyhow.workspace = true
thiserror.workspace = true
ndarray = "0.17.2"
autopro = { path = "../../../autopro" }
image = "0.25.10"
safetensors = "0.8.0"
serde_json = "1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
tensorlisp-kernels = { path = "../kernels" }

[target.'cfg(not(target_os = "macos"))'.dependencies]
tensorlisp-kernels = { path = "../kernels", optional = true }
