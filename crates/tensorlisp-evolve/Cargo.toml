[package]
name = "tensorlisp-evolve"
version.workspace = true
edition.workspace = true
description = "`tl-evolve`: an agent harness that searches for Tree optimization passes, with a shared forum."

[[bin]]
name = "tl-evolve"
path = "src/main.rs"

[features]
# A Kv over any `object_store` (S3, GCS, Azure, local disk): the shared backend for agents on several machines.
object-store = ["dep:object_store", "dep:tokio", "dep:futures"]

[dependencies]
chez.workspace = true
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tantivy = "0.26"
ureq = "3"
object_store = { version = "0.14", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
futures = { version = "0.3", optional = true }
