[package]
name = "ggml-sys"
version.workspace = true
edition.workspace = true
description = "Builds the vendored ggml (vendor/ggml) and exposes bindgen FFI bindings."
links = "ggml"

[dependencies]
ggml-codegen.workspace = true

[build-dependencies]
bindgen = "0.72.1"
# "parallel" isn't on by default upstream: without it cc-rs compiles every
# object file (all 141+ of ggml-cuda's) strictly one at a time regardless of
# CPU count or cargo's -j/NUM_JOBS.
cc = { version = "1.4.3", features = ["parallel"] }

[features]
default = ["platform-backends"]
# Enable every backend the target platform supports (Metal on macOS).
# Turn default features off to pick backends explicitly.
platform-backends = []
metal = []
# Needs the CUDA Toolkit (CUDA_PATH/CUDA_HOME/CUDA_ROOT); not implied by
# platform-backends since its presence isn't guaranteed by the OS alone.
cuda = []
