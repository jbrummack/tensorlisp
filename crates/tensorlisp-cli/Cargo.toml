[package]
name = "tensorlisp-cli"
version.workspace = true
edition.workspace = true
description = "`tl`: inspect, convert, check, run, compare and quantize tensorlisp models."

[[bin]]
name = "tl"
path = "src/main.rs"

[dependencies]
tensorlisp = { path = "../tensorlisp" }
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
half = "2.7.1"
memmap2 = "0.9"
ndarray = "0.17.2"
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
