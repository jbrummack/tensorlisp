[package]
name = "tensorlisp-kernels"
version.workspace = true
edition.workspace = true
description = "Backend-native kernel launcher (Metal, CUDA) plus vendored paged-attention kernels. No ggml, no torch/candle."
license = "MIT"

[features]
# Share the MTLDevice/queue/buffers of ggml's Metal backend (see src/metal/ggml.rs).
ggml = ["dep:ggml-sys"]
# CUDA Driver API + NVRTC, both dlopen'd at runtime (see src/cuda/sys.rs): the
# crate still builds and links without a CUDA install; Device::system_default()
# returns NoDevice if nvcuda/nvrtc aren't found on the target machine.
cuda = ["dep:libloading"]
# Vulkan compute backend; ash dlopen's the loader at runtime, so the crate
# builds without the SDK (see src/vulkan and docs/design/scheduler.md).
vulkan = ["dep:ash"]
# The Vulkan executor's Tree lowering on Metal (src/metal/tree.rs); the lowering lives under `vulkan`.
metal-tree = ["vulkan"]
# WGSL -> SPIR-V through naga, to write small kernels without glslc.
wgsl = ["dep:naga"]

[dependencies]
thiserror.workspace = true
ggml-sys = { workspace = true, optional = true }
libloading = { version = "0.8", optional = true }
ash = { version = "0.38", default-features = false, features = ["loaded", "std"], optional = true }
naga = { version = "30", features = ["wgsl-in", "spv-out"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"

[build-dependencies]
bindgen = "0.72.1"

[dev-dependencies]
half = "2"
