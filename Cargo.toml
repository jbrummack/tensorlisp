[workspace]
resolver = "3"
members = [
    "crates/ggml-sys",
    "crates/ggml-codegen",
    "crates/tensorlisp",
    "crates/importers",
    "experiments/handrolled-lisp",
]
default-members = ["crates/tensorlisp"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ggml-sys = { path = "crates/ggml-sys" }
ggml-codegen = { path = "crates/ggml-codegen" }
anyhow = "1.0.104"
thiserror = "2.0.20"
lasso = "0.7.3"
prost = "0.14.4"
prost-build = "0.14.4"
